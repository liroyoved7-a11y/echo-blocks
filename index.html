<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10112a" />
    <meta name="description" content="הד קוביות — משחק פאזל צבעוני עם קומבואים וצלילים." />
    <title>הד קוביות</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="top-stat current-stat"><small>ניקוד</small><strong id="current-score">0</strong></div>
        <a class="brand" href="./" aria-label="הד קוביות"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><strong>הד קוביות</strong></a>
        <div class="top-actions">
          <div class="top-stat best-stat"><small>השיא שלך</small><strong id="best-score">0</strong></div>
          <button class="icon-button settings-button" id="open-settings" type="button" aria-label="הגדרות" title="הגדרות">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4Z"/><path d="m19.4 13.5 1.1.8-1.1 1.9-1.3-.5a7.8 7.8 0 0 1-1.5.9l-.2 1.4h-2.2l-.3-1.4a7.8 7.8 0 0 1-1.7 0l-.8 1.2-1.9-1.1.5-1.3a7.8 7.8 0 0 1-.9-1.5l-1.4-.2v-2.2l1.4-.3a7.8 7.8 0 0 1 0-1.7l-1.2-.8 1.1-1.9 1.3.5a7.8 7.8 0 0 1 1.5-.9l.2-1.4h2.2l.3 1.4a7.8 7.8 0 0 1 1.7 0l.8-1.2 1.9 1.1-.5 1.3a7.8 7.8 0 0 1 .9 1.5l1.4.2v2.2l-1.4.3a7.8 7.8 0 0 1 0 1.7Z"/></svg>
          </button>
        </div>
      </header>

      <section class="game" aria-label="הד קוביות">
        <div class="combo-banner" id="combo-banner" aria-live="polite" aria-atomic="true"></div>
        <div class="board-frame">
          <div class="board" id="board" role="grid" aria-label="לוח משחק 8 על 8"></div>
          <div class="game-over" id="game-over" hidden>
            <div class="game-over-card">
              <span class="over-icon" aria-hidden="true">✦</span>
              <h1>הסיבוב הסתיים</h1>
              <p>הניקוד שלך: <strong id="final-score">0</strong></p>
              <button class="primary-button" id="play-again" type="button">לסיבוב נוסף <span aria-hidden="true">↻</span></button>
            </div>
          </div>
        </div>
        <div class="shape-tray" id="shape-tray" aria-label="הצורות הזמינות"></div>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog" class="settings-panel">
        <div class="settings-heading">
          <h2 id="settings-title">הגדרות</h2>
          <button class="icon-button close-button" id="close-settings" type="button" aria-label="סגירת ההגדרות">×</button>
        </div>
        <label class="setting-row volume-setting" for="music-volume">
          <span><strong>עוצמת המוזיקה</strong></span>
          <input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.38" />
          <span class="volume-value" id="volume-value">38%</span>
        </label>
        <label class="setting-row toggle-row" for="mute-music">
          <span><strong>השתקת מוזיקה</strong></span>
          <input class="switch-input" id="mute-music" type="checkbox" />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="setting-row toggle-row" for="show-combo">
          <span><strong>הצגת COMBO</strong></span>
          <input class="switch-input" id="show-combo" type="checkbox" checked />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <button class="secondary-button" id="new-game" type="button">משחק חדש <span aria-hidden="true">↻</span></button>
      </form>
    </dialog>
  </body>
</html>
